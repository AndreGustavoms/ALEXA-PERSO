name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Linux audio libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 espeak-ng
      - run: python -m pip install -r assistant_runtime/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: python -m unittest discover -s assistant_runtime/tests -v
      - run: python -m assistant_runtime.intent_benchmark
      - run: python scripts/build_desktop.py --help
